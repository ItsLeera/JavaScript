<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <h2>Addition of numbers</h2>

    <input type="text" placeholder="enter first value"><br><br>

    <input list="operators" placeholder="Select operator"><br><br>

    <datalist id="operators">
        <option value="+">
        <option value="-">
        <option value="*">
        <option value="÷">
        <option value="%">
    </datalist>

    <input type="text" placeholder="enter second value"><br><br>

    <button>CALCULATE</button>
    </body>

</html>
