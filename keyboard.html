<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="keyboard.css">
    <title>Keyboard Layout</title>
</head>

<body>

    <div class="keyboard">

        <!-- Row 1 -->
        <div class="row" id="first_row">
            <button class="key">esc</button>
            <button>f1</button>
            <button>f2</button>
            <button>f3</button>
            <button>f4</button>
            <button>f5</button>
            <button>f6</button>
            <button>f7</button>
            <button>f8</button>
            <button>f9</button>
            <button>f10</button>
            <button>f11</button>
            <button>f12</button>
            <button>prt sc</button>
            <button>ins</button>
            <button>del</button>
        </div>

        <!-- Row 2 -->
        <div class="row">
            <button>` <span class="secondary">~</span></button>
            <button>1 <span class="secondary">!</span></button>
            <button>2 <span class="secondary">@</span></button>
            <button>3 <span class="secondary">#</span></button>
            <button>4 <span class="secondary">$</span></button>
            <button>5 <span class="secondary">%</span></button>
            <button>6 <span class="secondary">^</span></button>
            <button>7 <span class="secondary">&amp;</span></button>
            <button>8 <span class="secondary">*</span></button>
            <button>9 <span class="secondary">(</span></button>
            <button>0 <span class="secondary">)</span></button>
            <button>- <span class="secondary">_</span></button>
            <button>= <span class="secondary">+</span></button>
            <button>backspace</button>
        </div>

        <!-- Row 3 -->
        <div class="row">
            <button>tab</button>
            <button>Q</button>
            <button>W</button>
            <button>E</button>
            <button>R</button>
            <button>T</button>
            <button>Y</button>
            <button>U</button>
            <button>I</button>
            <button>O</button>
            <button>P</button>
            <button>[ <span class="secondary">{</span></button>
            <button>] <span class="secondary">}</span></button>
            <button>\ <span class="secondary">|</span></button>
        </div>

        <!-- Row 4 -->
        <div class="row">
            <button>caps</button>
            <button>A</button>
            <button>S</button>
            <button>D</button>
            <button>F</button>
            <button>G</button>
            <button>H</button>
            <button>J</button>
            <button>K</button>
            <button>L</button>
            <button>; <span class="secondary">:</span></button>
            <button>' <span class="secondary">"</span></button>
            <button>enter</button>
        </div>

        <!-- Row 5 -->
        <div class="row">
            <button>shift</button>
            <button>Z</button>
            <button>X</button>
            <button>C</button>
            <button>V</button>
            <button>B</button>
            <button>N</button>
            <button>M</button>
            <button>, <span class="secondary">&lt;</span></button>
            <button>. <span class="secondary">&gt;</span></button>
            <button>/ <span class="secondary">?</span></button>
            <button>shift</button>
        </div>

        <!-- Row 6 -->
        <div class="row">
            <button>ctrl</button>
            <button>fn</button>
            <button>win</button>
            <button>alt</button>
            <button></button> <!-- spacebar -->
            <button>alt</button>
            <button>ctrl</button>
            <button>&lt;<span class="secondary">home</span></button>

            <div class="pg">
                <button>pg up</button>
                <button>pg dn</button>
            </div>

            <button>&gt;<span class="secondary">end</span></button>
        </div>

    </div>

</body>

</html>
